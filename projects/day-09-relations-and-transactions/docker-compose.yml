services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: graphql
      POSTGRES_PASSWORD: graphql
      POSTGRES_DB: graphql_orders
    ports:
      - "5438:5432"
    volumes:
      - graphql_orders_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphql -d graphql_orders"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  graphql_orders_data:
