services:
  postgres:
    image: postgres:16-alpine
    container_name: graphql-prisma-postgres
    environment:
      POSTGRES_USER: graphql
      POSTGRES_PASSWORD: graphql
      POSTGRES_DB: graphql_learning
    ports:
      - "5437:5432"
    volumes:
      - graphql_prisma_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphql -d graphql_learning"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  graphql_prisma_data:
